<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>User Registration Form</title>
  </head>
  <body>
    <form>
      <h1>User Registration</h1>

      <div class="field">
        <label for="first_name">First Name</label>
        <input
          type="text"
          id="first_name"
          placeholder="Enter first name"
          required
        />
      </div>

      <div class="field">
        <label for="last_name">Last Name</label>
        <input
          type="text"
          id="last_name"
          placeholder="Enter last name"
          required
        />
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="email@example.com"
          required
        />
      </div>

      <div class="field">
        <label for="pass">Password</label>
        <input type="password" id="pass" placeholder="••••••••" required />
      </div>

      <div class="field">
        <label for="date">Date of Birth</label>
        <input type="date" id="date" required />
      </div>

      <div class="selection-group">
        <h3>Gender</h3>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male" class="inline-label">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female" class="inline-label">Female</label>
      </div>

      <div class="field">
        <label for="age">Age Selection</label>
        <input type="range" id="age" min="1" max="100" />
      </div>

      <div class="selection-group">
        <h3>Hobbies</h3>
        <input type="checkbox" id="music" name="hobbies" value="music" />
        <label for="music" class="inline-label">Music</label>

        <input type="checkbox" id="sports" name="hobbies" value="sports" />
        <label for="sports" class="inline-label">Sports</label>

        <input type="checkbox" id="reading" name="hobbies" value="reading" />
        <label for="reading" class="inline-label">Reading</label>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <select name="country" id="country">
          <option value="nepal">Nepal</option>
          <option value="usa">USA</option>
          <option value="china">China</option>
        </select>
      </div>

      <input type="submit" value="Submit Registration" />
    </form>
  </body>
</html>
